[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos_stt_plugin_server"
dynamic = ["version"]
description = "ovos stt server plugin for mycroft"
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "JarbasAi", email = "jarbasai@mailfence.com" },
]
keywords = ["mycroft", "OpenVoiceOS", "OVOS", "plugin", "stt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
]
dependencies = [
    "ovos-plugin-manager>=2.1.1,<3.0.0",
    "ovos-utils>=0.8.4,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-stt-server-plugin"

[project.entry-points."opm.stt"]
"ovos-stt-plugin-server" = "ovos_stt_plugin_server:OVOSHTTPServerSTT"

[project.entry-points."opm.stt.config"]
"ovos-stt-plugin-server.config" = "ovos_stt_plugin_server:OVOSHTTPServerSTTConfig"

[project.entry-points."opm.transformer.audio"]
"ovos-audio-lang-server-plugin" = "ovos_stt_plugin_server:OVOSServerLangClassifier"

[tool.setuptools.dynamic]
version = { attr = "ovos_stt_plugin_server.version.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_stt_plugin_server*"]
